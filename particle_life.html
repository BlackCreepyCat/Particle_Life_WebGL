<head>
  <meta charset="utf-8">
  <title>Particles Life - By Creepy Cat (C)2025 - Based on the work of : https://www.youtube.com/watch?v=0Kx4Y9TVMGg</title>

  <style>
    html, body { margin:0; padding:0; overflow:hidden; height:100%; background:#000; }
    canvas { display:block; }

    /* ───────────── Overlay Interface ───────────── */
    #uiPanel {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(20,20,20,0.92);
      color:#eee;
      font-family: Arial, sans-serif;
      padding:20px;
      display:none;
      overflow-y:auto;
      z-index: 10;
    }

    h1 {
      text-align:center;
      color:#ff7f22;
      margin-bottom:15px;
      font-size:24px;
    }

    /* Conteneur compact */
    #groupControls {
      display:flex;
      gap:15px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .groupBox {
      width:260px;
      background: #2b2b2b;
      border:1px solid #555;
      border-radius:12px;
      padding:12px 15px;
      box-shadow:0 0 8px rgba(0,0,0,0.4);
    }

    .groupBox h2 {
      color:#ff7f22;
      margin:0 0 10px 0;
      font-size:18px;
      text-align:center;
    }

    label {
      display:block;
      margin-top:6px;
      font-size:13px;
      color:#ccc;
    }

    input {
      width:90px;
      padding:3px 5px;
      background:#1a1a1a;
      border:1px solid #555;
      border-radius:6px;
      color:#eee;
      margin-top:2px;
    }

    input[type="text"] {
      width: calc(100% - 10px);
    }

    /* Bouton ajouter groupe */
    #addGroupButton {
      display:block;
      margin:20px auto;
      padding:10px 20px;
      font-size:14px;
      cursor:pointer;
      background:linear-gradient(180deg, #66bb6a, #4caf50);
      color:#fff;
      border:none;
      border-radius:8px;
      font-weight:bold;
      box-shadow:0 0 8px rgba(76,175,80,0.5);
      transition:0.15s;
    }

    #addGroupButton:hover {
      transform:scale(1.05);
      box-shadow:0 0 12px rgba(76,175,80,0.8);
    }

    /* Bouton supprimer groupe */
    .removeButton {
      display:block;
      margin:10px auto 0;
      padding:6px 12px;
      font-size:13px;
      cursor:pointer;
      background:linear-gradient(180deg, #ef5350, #f44336);
      color:#fff;
      border:none;
      border-radius:6px;
      font-weight:bold;
      box-shadow:0 0 6px rgba(244,67,54,0.5);
      transition:0.15s;
    }

    .removeButton:hover {
      transform:scale(1.05);
      box-shadow:0 0 10px rgba(244,67,54,0.8);
    }

    /* Bouton principal */
    #applyButton {
      display:block;
      margin:20px auto;
      padding:12px 28px;
      font-size:16px;
      cursor:pointer;
      background:linear-gradient(180deg, #ff9b3c, #ff7f22);
      color:#222;
      border:none;
      border-radius:10px;
      font-weight:bold;
      box-shadow:0 0 10px rgba(255,120,30,0.5);
      transition:0.15s;
    }

    #applyButton:hover {
      transform:scale(1.05);
      box-shadow:0 0 15px rgba(255,120,30,0.8);
    }

    .info {
      text-align:center;
      margin-top:5px;
      color:#bbb;
      font-size:13px;
    }
  </style>
</head>

/* ==========================================================
   VARIABLES GLOBALES
========================================================== */
let groups = [];
let allParticles = [];
let particleImg;
let grid;

p5.disableFriendlyErrors = true;

/* paramètres initiaux */
let groupSettings = [
  { name:"Bleu",   num:700, visc:0.10, force:0.136, radius:50,  col:[80,120,255],  w:128, h:128 },
  { name:"Rouge",  num:700, visc:0.10, force:0.136, radius:50,  col:[255,120,30],  w:256, h:256 },
  { name:"Leader", num:2,   visc:0.301,force:0.7,   radius:120, col:[100,255,30],  w:512, h:512 }
];

/* ==========================================================
   P5 : PRELOAD / SETUP
========================================================== */
function preload() {
  particleImg = loadImage(PARTICLE_BASE64);
}

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);
  pixelDensity(1);
  imageMode(CENTER);
  noStroke();
  noSmooth();

  buildUI();
  initParticlesAndGrid();
}

/* ==========================================================
   REDIMENSIONNEMENT
========================================================== */
function windowResized() {
  const oldW = width;
  const oldH = height;

  resizeCanvas(windowWidth, windowHeight);

  for (let p of allParticles) {
    p.x = map(p.x, -oldW/2, oldW/2, -width/2, width/2);
    p.y = map(p.y, -oldH/2, oldH/2, -height/2, height/2);
  }

  initParticlesAndGrid();
}

/* ==========================================================
   INTERFACE PARAMÈTRES
========================================================== */
function buildUI() {
  const container = document.getElementById("groupControls");
  container.innerHTML = "";

  groupSettings.forEach((g, i) => {
    container.innerHTML += `
      <div class="groupBox">
        <label>Nom du groupe</label>
        <input id="name${i}" type="text" value="${g.name}">

        <label>Nombre</label><input id="num${i}" type="number" value="${g.num}">
        <label>Viscosité</label><input id="visc${i}" type="number" step="0.001" value="${g.visc}">
        <label>Force</label><input id="force${i}" type="number" step="0.001" value="${g.force}">
        <label>Rayon</label><input id="radius${i}" type="number" value="${g.radius}">
        <label>Largeur sprite</label><input id="w${i}" type="number" value="${g.w}">
        <label>Hauteur sprite</label><input id="h${i}" type="number" value="${g.h}">

        <label>Couleur (R G B)</label>
        <input id="r${i}" type="number" max="255" min="0" value="${g.col[0]}">
        <input id="g${i}" type="number" max="255" min="0" value="${g.col[1]}">
        <input id="b${i}" type="number" max="255" min="0" value="${g.col[2]}">

        <button class="removeButton" onclick="removeGroup(${i})">Supprimer le groupe</button>
      </div>
    `;
  });
}

function addGroup() {
  groupSettings.push({
    name: "Nouveau",
    num: 500,
    visc: 0.10,
    force: 0.136,
    radius: 50,
    col: [255, 255, 255],
    w: 128,
    h: 128
  });
  buildUI();
}

function removeGroup(index) {
  groupSettings.splice(index, 1);
  buildUI();
}

function applySettings() {
  groupSettings.forEach((g, i) => {
    g.name   = document.getElementById("name" + i).value;
    g.num    = parseInt(document.getElementById("num" + i).value);
    g.visc   = parseFloat(document.getElementById("visc" + i).value);
    g.force  = parseFloat(document.getElementById("force" + i).value);
    g.radius = parseFloat(document.getElementById("radius" + i).value);
    g.w      = parseInt(document.getElementById("w" + i).value);
    g.h      = parseInt(document.getElementById("h" + i).value);
    g.col    = [
      parseInt(document.getElementById("r" + i).value),
      parseInt(document.getElementById("g" + i).value),
      parseInt(document.getElementById("b" + i).value)
    ];
  });

  initParticlesAndGrid();

  // Cacher l'interface automatiquement après relance
  document.getElementById("uiPanel").style.display = "none";
}

/* ==========================================================
   INIT DES PARTICULES + SPATIAL GRID
========================================================== */
function initParticlesAndGrid() {
  groups = [];
  allParticles = [];

  groupSettings.forEach(s =>
    createGroup(s.num, s.visc, s.force, s.radius, color(...s.col), s.w, s.h)
  );

  const cellSize = 50;
  grid = new SpatialGrid(cellSize, width, height);
  for (let p of allParticles) grid.insert(p);
}

function createGroup(num, visc, force, radius, col, w, h) {
  let g = { viscosity: visc, force: force, radius: radius, col: col, width: w, height: h, particles: [] };
  for (let i = 0; i < num; i++) {
    let p = {
      x: random(-width/2, width/2),
      y: random(-height/2, height/2),
      vx: 0, vy: 0, group: g
    };
    g.particles.push(p);
    allParticles.push(p);
  }
  groups.push(g);
}

/* ==========================================================
   SPATIAL GRID
========================================================== */
class SpatialGrid {
  constructor(cellSize, w, h) {
    this.cellSize = cellSize;
    this.cols = Math.ceil(w / cellSize);
    this.rows = Math.ceil(h / cellSize);
    this.cells = Array.from({ length: this.cols * this.rows }, () => []);
  }
  insert(p) {
    const col = Math.floor((p.x + width/2) / this.cellSize);
    const row = Math.floor((p.y + height/2) / this.cellSize);
    if (col>=0 && col<this.cols && row>=0 && row<this.rows)
      this.cells[row * this.cols + col].push(p);
  }
  getNeighbors(p) {
    const arr = [];
    const col = Math.floor((p.x + width/2) / this.cellSize);
    const row = Math.floor((p.y + height/2) / this.cellSize);
    for (let dx=-1; dx<=1; dx++)
      for (let dy=-1; dy<=1; dy++) {
        const c = col + dx, r = row + dy;
        if (c>=0 && c<this.cols && r>=0 && r<this.rows)
          arr.push(...this.cells[r*this.cols + c]);
      }
    return arr;
  }
  clear() { this.cells.forEach(c => c.length = 0); }
}

/* ==========================================================
   EXPLOSION AU CLIC
========================================================== */
function mousePressed() {
  if (mouseButton !== LEFT) return;

  const cx = mouseX - width/2;
  const cy = mouseY - height/2;

  for (let p of allParticles) {
    const dx = p.x - cx;
    const dy = p.y - cy;
    const d = Math.hypot(dx, dy) + 50;
    const f = 3000 / d;
    p.vx += f * dx / d;
    p.vy += f * dy / d;
  }
}

/* ==========================================================
   TOUCHE ESPACE : AFFICHER/CACHER UI
========================================================== */
function keyPressed() {
  if (key === " ") {
    const ui = document.getElementById("uiPanel");
    ui.style.display = (ui.style.display === "none") ? "block" : "none";
  }
}

/* ==========================================================
   PHYSIQUE + RENDU
========================================================== */
function draw() {
  clear();
  background(0);
  blendMode(ADD);

  // Reconstruction du spatial grid
  grid.clear();
  for (let p of allParticles) grid.insert(p);

  for (let p of allParticles) {

    let ax = 0, ay = 0;
    const px = p.x, py = p.y;

    const radius = p.group.radius;
    const r2 = radius * radius;

    const neighbors = grid.getNeighbors(p);

    // --- Optimisation lourde ici ---
    for (let o of neighbors) {
      if (p === o) continue;

      const dx = o.x - px;
      const dy = o.y - py;

      const d2 = dx * dx + dy * dy;
      if (d2 > 0 && d2 < r2) {

        // Utilise inverse de la distance au lieu du sqrt
        const invDist = 1 / Math.sqrt(d2);

        // Force groupe interne ou externe
        const f = (p.group === o.group)
          ? -p.group.force
          :  o.group.force;

        // Normalisation déjà faite via invDist
        ax += f * dx * invDist;
        ay += f * dy * invDist;
      }
    }

    // Amortissement (optimisé)
    const damp = (p.group.particles.length === 1) ? 0.699 : 0.90;
	//const damp = p.group.viscosity;
	
    p.vx = (p.vx + ax) * damp;
    p.vy = (p.vy + ay) * damp;

    p.x += p.vx;
    p.y += p.vy;

    // Torus optimisé (pas de if multiples)
    if (p.x < -width/2)  p.x += width;
    else if (p.x > width/2) p.x -= width;

    if (p.y < -height/2) p.y += height;
    else if (p.y > height/2) p.y -= height;
  }

  // Rendu (inchangé)
  for (let g of groups) {
    tint(red(g.col), green(g.col), blue(g.col));
    for (let p of g.particles) {
      push();
      translate(p.x, p.y);
      image(particleImg, 0, 0, g.width, g.height);
      pop();
    }
  }
  noTint();
}
